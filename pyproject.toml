[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-agent"
version = "0.2.0"
description = "Local restaurant review intelligence with Ollama, ChromaDB, CLI, and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "ollama>=0.6.2",
    "pandas>=3.0.2",
    "streamlit>=1.60.0",
]

[project.scripts]
local-ai-agent = "local_ai_agent.cli:main"

[tool.setuptools]
py-modules = [
    "agent",
    "dashboard",
    "dashboard_support",
    "evaluation",
    "main",
    "ollama_health",
    "vector",
]
packages = ["local_ai_agent", "local_ai_agent.data"]
include-package-data = true

[tool.setuptools.package-data]
"local_ai_agent.data" = ["*.csv", "*.json"]

[tool.coverage.run]
source = ["."]

[tool.coverage.report]
include = [
    "agent.py",
    "dashboard_support.py",
    "evaluation.py",
    "main.py",
    "ollama_health.py",
    "vector.py",
]
show_missing = true

[tool.mypy]
files = [
    "agent.py",
    "dashboard_support.py",
    "evaluation.py",
    "main.py",
    "ollama_health.py",
    "vector.py",
]
check_untyped_defs = true
ignore_missing_imports = true
